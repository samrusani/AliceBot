name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify release identity and exact artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_TARGET: ${{ github.event.release.target_commitish }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_DRAFT: ${{ github.event.release.draft }}
    steps:
      - name: Require repository release-control attestation variable
        env:
          RELEASE_CONTROLS_ATTESTATION: ${{ vars.ALICE_RELEASE_CONTROLS_ATTESTATION }}
        run: test -n "$RELEASE_CONTROLS_ATTESTATION"

      - name: Reject non-stable release events
        run: |
          test "$RELEASE_PRERELEASE" = "false"
          test "$RELEASE_DRAFT" = "false"
          test "$RELEASE_TARGET" = "main"

      - name: Checkout the exact release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release-specific repository controls
        env:
          RELEASE_CONTROLS_ATTESTATION: ${{ vars.ALICE_RELEASE_CONTROLS_ATTESTATION }}
        run: >-
          python scripts/check_release_controls_attestation.py
          --repository "$GITHUB_REPOSITORY"
          --release-sha "$GITHUB_SHA"
          --release-tag "$RELEASE_TAG"
          --attestation-env RELEASE_CONTROLS_ATTESTATION

      - name: Fetch the protected main head
        run: git fetch --no-tags origin main

      - name: Verify tag, version, SHA, main head, and PyPI uniqueness
        run: >-
          python scripts/release_check.py
          --tag "$RELEASE_TAG"
          --expected-sha "$GITHUB_SHA"
          --require-main-head
          --require-clean
          --require-finalized-release-docs
          --check-pypi

      - name: Require successful checks on the exact release SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_github_release_checks.py
          --repo "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"

      - name: Resolve successful exact-SHA semantic gate run
        id: semantic-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/semantic-release-gate.yml/runs?head_sha=${GITHUB_SHA}&event=workflow_dispatch&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact-SHA semantic eval evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: semantic-eval-attestation-${{ github.sha }}
          path: semantic-eval-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.semantic-gate.outputs.run-id }}

      - name: Verify credential-free semantic eval attestation
        run: >-
          python scripts/release_check.py
          --expected-sha "$GITHUB_SHA"
          --semantic-eval-attestation semantic-eval-evidence/semantic-eval-attestation.json

      - name: Install release dependencies
        run: python -m pip install -e '.[dev]'

      - name: Recheck release-critical source tests
        run: |
          python -m pytest tests/unit -q
          python -m pytest eval/longmemeval -q
          python scripts/check_longmemeval_evidence.py

      - name: Build wheel and sdist once
        run: python -m build --outdir dist

      - name: Validate and hash exact artifacts
        run: |
          python -m twine check dist/*
          python scripts/release_check.py --dist-dir dist --write-checksums

      - name: Resolve canonical version
        id: version
        run: echo "value=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Install and smoke exact wheel and sdist
        run: >-
          python scripts/test_distribution_artifact.py
          dist/*.whl dist/*.tar.gz
          --expected-version ${{ steps.version.outputs.value }}

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-pypi-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified bytes (trusted publishing)
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/alice-memory
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-pypi-dist-${{ github.sha }}
          path: verified

      - name: Verify artifact checksums after job transfer
        run: |
          cd verified
          sha256sum -c SHA256SUMS

      - name: Isolate publishable distributions
        run: |
          mkdir packages
          cp verified/*.whl verified/*.tar.gz packages/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: packages/
          print-hash: true
