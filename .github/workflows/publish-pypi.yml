name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Sanity-check wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "alicebot_api/onramp.py",
              "alicebot_api/sqlite_store.py",
              "alicebot_api/sqlite_schema.py",
              "alicebot_api/mcp_server.py",
          ]
          missing = [n for n in required if n not in names]
          leaked = [n for n in names if n.startswith(("tests/", "docs/", "eval/"))]
          if missing or leaked:
              sys.exit(f"wheel check failed: missing={missing} leaked={leaked}")
          print(f"wheel ok: {wheel} ({len(names)} files)")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/alice-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
