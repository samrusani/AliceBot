name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Unit tests + live eval battery (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: LongMemEval harness tests (no dataset required)
        run: python -m pytest eval/longmemeval/test_harness.py -q
      - name: "Live eval battery on sqlite in-memory"
        env:
          ALICEBOT_EVAL_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m alicebot_api eval run --suite all > /tmp/eval.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/eval.json"))["report"]
          suites = {s["suite_key"]: s["status"] for s in report["suites"]}
          print("suites:", suites)
          assert report["status"] == "pass", f"eval battery failed: {report['status']}"
          assert len(suites) >= 4, f"expected >=4 executed suites, got {list(suites)}"
          EOF

  python-integration:
    name: Integration tests (Postgres + pgvector, role separation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alicebot_admin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_admin -d alicebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (repo-local venv — integration tests spawn scripts that require .venv)
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e '.[dev]'
      - name: Bootstrap extension and app role
        # The app role must NOT be a superuser: superusers bypass row-level
        # security, which silently disables every isolation test.
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U alicebot_admin -d alicebot -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE ROLE alicebot_app LOGIN PASSWORD 'ci';
            GRANT CONNECT ON DATABASE alicebot TO alicebot_app;
          "
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        run: ./.venv/bin/python -m pytest tests/integration -q -p no:cacheprovider

  web:
    name: Web tests, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provide local env (mirrors make setup)
        run: test -f .env.local || cp .env.local.example .env.local
      - name: Test
        # CI runners are slower than dev machines; one heavy page test needs
        # more than vitest's 10s default there.
        # No `--` separator: pnpm forwards it literally and vitest would treat
        # the flag as a filename filter.
        run: pnpm test --testTimeout=30000
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
