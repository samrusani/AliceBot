name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Unit tests + live eval battery (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests with coverage baseline
        run: |
          python -m pytest tests/unit -q --cov=alicebot_api --cov-report=term --cov-report=xml --cov-report=json:/tmp/alicebot-python-coverage.json --cov-fail-under=50
          python scripts/check_python_coverage.py --coverage-json /tmp/alicebot-python-coverage.json --path apps/api/src/alicebot_api/main.py --min-percent 45
      - name: All model-free LongMemEval tests and dataset-manifest consistency
        run: python -m pytest eval/longmemeval -q
      - name: Replay committed LongMemEval evidence
        run: python scripts/check_longmemeval_evidence.py
      - name: Configured vector-stage contract
        # This uses the provider adapter test double to exercise the real
        # retrieval/fusion path. It is contract coverage, not quality evidence.
        run: >-
          python -m pytest
          tests/unit/test_vnext_retrieval.py::test_context_pack_fuses_vector_results_with_rrf_when_provider_is_configured
          tests/unit/test_vnext_evals.py::test_retrieval_quality_metrics_against_known_rankings
          -q
      - name: "Live eval battery on sqlite in-memory (model-free, fts_only)"
        # Model-free plumbing check: every suite runs against a live sqlite
        # store with NO embedding provider, so retrieval is fts_only. This is
        # NOT the canonical release gate -- it cannot measure semantic
        # (paraphrase) retrieval quality. The release gate is the fail-closed
        # step below.
        env:
          ALICEBOT_EVAL_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m alicebot_api eval run --suite all > /tmp/eval.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/eval.json"))["report"]
          suites = {s["suite_key"]: s["status"] for s in report["suites"]}
          print("suites:", suites)
          assert report["status"] == "pass", f"eval battery failed: {report['status']}"
          assert len(suites) >= 4, f"expected >=4 executed suites, got {list(suites)}"
          # Honest labeling: without an embedding provider this run is fts_only
          # and did NOT enforce the paraphrase gate, so it must never be
          # mistaken for the release gate.
          retrieval = next(s for s in report["suites"] if s["suite_key"] == "retrieval_quality")
          assert retrieval["metrics"]["retrieval_mode"] == "fts_only", retrieval["metrics"]["retrieval_mode"]
          assert retrieval["metrics"]["paraphrase_targets_enforced"] is False
          EOF
      - name: "Canonical release gate fails closed without a vector provider"
        # The release-designated eval must measure semantic/paraphrase quality.
        # With no embedding provider configured it runs fts_only and MUST NOT
        # report a full pass: the retrieval suite reports `pass_fts_only`, the
        # aggregate fails because not every release case passed, and the CLI
        # exits nonzero, so
        # "the release eval is green" can never mean less than measured semantic
        # quality. A real release run supplies ALICE_EMBEDDINGS_* + pgvector so
        # the vector/paraphrase gate actually executes.
        env:
          ALICEBOT_EVAL_DATABASE_URL: "sqlite:///:memory:"
        run: |
          set +e
          python -m alicebot_api eval run --suite all --release-gate > /tmp/eval_gate.json
          code=$?
          set -e
          test "$code" -ne 0 || { echo "release gate did not fail closed (exit $code)"; exit 1; }
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/eval_gate.json"))["report"]
          print("release-gate status:", report["status"])
          assert report["status"] == "fail", report["status"]
          retrieval = next(s for s in report["suites"] if s["suite_key"] == "retrieval_quality")
          assert retrieval["status"] == "pass_fts_only", retrieval["status"]
          assert retrieval["metrics"]["paraphrase_targets_enforced"] is False
          EOF

  python-quality:
    name: Python correctness lint, types, and release truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Control-document truth
        run: python scripts/check_control_doc_truth.py
      - name: Release metadata consistency
        run: python scripts/release_check.py
      - name: Correctness-only lint
        run: python -m ruff check apps/api/src/alicebot_api scripts tests eval/longmemeval
      - name: Normal cross-module first-party type check
        run: >-
          python -m mypy --ignore-missing-imports apps/api/src/alicebot_api
          scripts/release_check.py scripts/test_distribution_artifact.py
          scripts/normalize_sdist.py scripts/render_release_body.py
          scripts/decode_github_release_body.py
          scripts/prepare_mainprotect_update.py
          scripts/check_python_coverage.py
          scripts/check_control_doc_truth.py scripts/check_github_release_checks.py
          scripts/check_release_controls_attestation.py
      - name: Compile Python sources
        run: python -m compileall -q apps/api/src/alicebot_api scripts eval/longmemeval

  python-distributions:
    name: Installed wheel + sdist contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and runtime dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build artifacts once
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python -m build --outdir dist
      - name: Require byte-reproducible rebuild
        run: |
          python scripts/normalize_sdist.py --source-date-epoch "$SOURCE_DATE_EPOCH" dist/*.tar.gz
          python -m build --outdir reproducibility-check
          python scripts/normalize_sdist.py --source-date-epoch "$SOURCE_DATE_EPOCH" reproducibility-check/*.tar.gz
          for artifact in dist/*.whl dist/*.tar.gz; do
            cmp "$artifact" "reproducibility-check/$(basename "$artifact")"
          done
      - name: Resolve canonical version
        id: version
        run: echo "value=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Validate metadata and packaged resources
        run: |
          python -m twine check dist/*
          python scripts/release_check.py --dist-dir dist --write-checksums
      - name: Install and smoke exact wheel and sdist
        run: >-
          python scripts/test_distribution_artifact.py
          dist/*.whl dist/*.tar.gz --expected-version ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alice-memory-distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  python-compatibility:
    name: Python ${{ matrix.python-version }} install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install package
        run: |
          python -m pip install build==1.5.0
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
          python -m pip install pytest==8.4.2
      - name: Import and entrypoint smoke
        run: |
          python -c 'import tomllib; from alicebot_api import __version__; from alicebot_api.main import app; expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert __version__ == app.version == expected'
          alice --version
          alicebot --version
          alice-memory --version
          alicebot-mcp --help
      - name: Representative installed-wheel functional tests
        env:
          # The repository pytest config adds apps/api/src for normal source
          # tests. Clear both injection paths so this compatibility job cannot
          # silently shadow the wheel it just installed.
          PYTHONPATH: ""
          ALICE_TEST_INSTALLED_WHEEL: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import alicebot_api

          module_path = Path(alicebot_api.__file__).resolve()
          repository_path = Path.cwd().resolve()
          assert not module_path.is_relative_to(repository_path), (
              f"alicebot_api resolved to checkout source instead of the installed wheel: {module_path}"
          )
          print(f"installed alicebot_api: {module_path}")
          PY
          python -m pytest -o pythonpath= \
            tests/unit/test_sqlite_onramp.py \
            tests/unit/test_config.py \
            tests/unit/test_mcp.py \
            -q

  python-integration:
    name: ${{ matrix.integration_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        integration_check: ["Integration tests (Postgres + pgvector, role separation)", "Default surface integration smoke (Postgres)"]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: alicebot_admin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_admin -d alicebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (repo-local venv — integration tests spawn scripts that require .venv)
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e '.[dev]'
      - name: Bootstrap extension and app role
        # The app role must NOT be a superuser: superusers bypass row-level
        # security, which silently disables every isolation test.
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U alicebot_admin -d alicebot -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE ROLE alicebot_app LOGIN PASSWORD 'ci';
            GRANT CONNECT ON DATABASE alicebot TO alicebot_app;
          "
          test "$(psql -h localhost -U alicebot_admin -d alicebot -Atqc "SELECT split_part(extversion, '.', 1)::int > 0 OR (split_part(extversion, '.', 1)::int = 0 AND split_part(extversion, '.', 2)::int >= 8) FROM pg_extension WHERE extname = 'vector'")" = "t"
      - name: Integration tests
        if: matrix.integration_check == 'Integration tests (Postgres + pgvector, role separation)'
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        run: ALICE_LEGACY_SURFACES=1 ./.venv/bin/python -m pytest tests/integration -q -p no:cacheprovider

      - name: Default-surface core round-trip
        if: matrix.integration_check == 'Default surface integration smoke (Postgres)'
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        run: |
          unset ALICE_LEGACY_SURFACES ALICE_MCP_LEGACY_TOOLS ALICE_AGENT_API_KEY
          ./.venv/bin/python -m pytest tests/integration/test_default_surface_integration.py -q -p no:cacheprovider

  web:
    name: Web tests, types, accessibility, and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provide local env (mirrors make setup)
        run: test -f .env.local || cp .env.local.example .env.local
      - name: Test
        run: pnpm test
      - name: Core coverage gate
        run: pnpm test:coverage:core
      - name: vNext coverage gate
        run: pnpm test:coverage:vnext
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm test:budget
      - name: Install browser runtime
        run: pnpm run setup:browser:linux
      - name: Browser navigation and accessibility
        run: pnpm test:browser
      - name: Retain Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Advisory response validator tests
        run: pnpm test:advisory-audit
      - name: Production dependency audit
        # The pinned pnpm 10 audit client uses retired endpoints. Keep the
        # repository's fail-closed bulk-endpoint wrapper until a deliberate
        # Node/pnpm major-toolchain upgrade is independently qualified.
        run: node scripts/npm-advisory-audit.mjs --prod --audit-level=high
      - name: Full dependency audit
        run: node scripts/npm-advisory-audit.mjs --audit-level=high
