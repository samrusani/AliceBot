name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Unit tests + live eval battery (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests with coverage baseline
        run: python -m pytest tests/unit -q --cov=alicebot_api --cov-report=term --cov-report=xml --cov-fail-under=50
      - name: All model-free LongMemEval tests
        run: python -m pytest eval/longmemeval -q
      - name: Replay committed LongMemEval evidence
        run: python scripts/check_longmemeval_evidence.py
      - name: Configured vector-stage contract
        # This uses the provider adapter test double to exercise the real
        # retrieval/fusion path. It is contract coverage, not quality evidence.
        run: >-
          python -m pytest
          tests/unit/test_vnext_retrieval.py::test_context_pack_fuses_vector_results_with_rrf_when_provider_is_configured
          tests/unit/test_vnext_evals.py::test_retrieval_quality_metrics_against_known_rankings
          -q
      - name: "Live eval battery on sqlite in-memory"
        env:
          ALICEBOT_EVAL_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m alicebot_api eval run --suite all > /tmp/eval.json
          python - <<'EOF'
          import json
          report = json.load(open("/tmp/eval.json"))["report"]
          suites = {s["suite_key"]: s["status"] for s in report["suites"]}
          print("suites:", suites)
          assert report["status"] == "pass", f"eval battery failed: {report['status']}"
          assert len(suites) >= 4, f"expected >=4 executed suites, got {list(suites)}"
          EOF

  python-quality:
    name: Python correctness lint, types, and release truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Control-document truth
        run: python scripts/check_control_doc_truth.py
      - name: Release metadata consistency
        run: python scripts/release_check.py
      - name: Correctness-only lint
        run: python -m ruff check apps/api/src/alicebot_api scripts tests eval/longmemeval
      - name: Bounded type check for release tooling
        run: >-
          python -m mypy --follow-imports=skip --ignore-missing-imports
          scripts/release_check.py scripts/test_distribution_artifact.py
          scripts/check_control_doc_truth.py scripts/check_github_release_checks.py
      - name: Compile Python sources
        run: python -m compileall -q apps/api/src/alicebot_api scripts eval/longmemeval

  python-distributions:
    name: Installed wheel + sdist contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and runtime dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build artifacts once
        run: python -m build --outdir dist
      - name: Resolve canonical version
        id: version
        run: echo "value=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Validate metadata and packaged resources
        run: |
          python -m twine check dist/*
          python scripts/release_check.py --dist-dir dist --write-checksums
      - name: Install and smoke exact wheel and sdist
        run: >-
          python scripts/test_distribution_artifact.py
          dist/*.whl dist/*.tar.gz --expected-version ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alice-memory-distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  python-compatibility:
    name: Python ${{ matrix.python-version }} install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install package
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Import and entrypoint smoke
        run: |
          python -c 'import tomllib; from alicebot_api import __version__; from alicebot_api.main import app; expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert __version__ == app.version == expected'
          alice --version
          alicebot --version
          alice-memory --version
          alicebot-mcp --help

  python-integration:
    name: Integration tests (Postgres + pgvector, role separation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: alicebot_admin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicebot_admin -d alicebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (repo-local venv — integration tests spawn scripts that require .venv)
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e '.[dev]'
      - name: Bootstrap extension and app role
        # The app role must NOT be a superuser: superusers bypass row-level
        # security, which silently disables every isolation test.
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U alicebot_admin -d alicebot -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE ROLE alicebot_app LOGIN PASSWORD 'ci';
            GRANT CONNECT ON DATABASE alicebot TO alicebot_app;
          "
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://alicebot_app:ci@localhost:5432/alicebot
          DATABASE_ADMIN_URL: postgresql://alicebot_admin:ci@localhost:5432/alicebot
        run: ./.venv/bin/python -m pytest tests/integration -q -p no:cacheprovider

  web:
    name: Web tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Provide local env (mirrors make setup)
        run: test -f .env.local || cp .env.local.example .env.local
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Full dependency audit
        run: pnpm audit --audit-level high
