[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alice-memory"
version = "0.0.1"
description = "Alice — the continuity layer for AI agents. Memory, open loops, resumption, and provenance over MCP and HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sami Rusani" }]
keywords = [
    "ai",
    "agents",
    "memory",
    "mcp",
    "continuity",
    "agent-memory",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/samrusani/AliceBot"
Repository = "https://github.com/samrusani/AliceBot"

[project.scripts]
alice-memory = "alice_memory:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alice_memory"]
